socket_type = "tcp"
socket_path = "127.0.0.1:9200"
cache_seconds = 5
neg_cache_seconds = 2
use_etag = true
#use_serialized_auth = false
auth_realm = "TEST Authentication"
#user_agent = "ngx_auth_mod"

#[response.ok]
#code=200
#message="Authorized"

[[and]]
#username_re = ''
auth_url = "http://127.0.0.1:9300"
set_username = "$u"
set_password = "$p"
#skip_cert_verify = false
#root_ca_files = [
#	"/etc/ssl/certs/Local-CA-Chain.cer",
#]
timeout = 5000

[and.set_header]
"X-Remote-User" = "$u"

[and.response.unauth]
#code=401
message="Not authenticated1"

[and.response.forbidden]
#code=403
message="Forbidden1"

[and.response.bad_request]
#code=400
message="Bad request1"

[and.response.bad_gateway]
#code=502
message="Bad gateway1"

[and.response.timeout]
#code=504
message="Timeout1"

[and.response.invalid_setting]
code=500
message="Invalid setting1"

[[and]]
username_re = '^[^@]+$'
auth_url = "https://auth.example.com/"
set_username = "$0@example.com"
set_password = "$p"
#skip_cert_verify = false
root_ca_files = [
	"/etc/ssl/certs/Local-CA-Chain.cer",
]
timeout = 15000

[and.set_header]
"X-Remote-User" = "$u"

[and.response.unauth]
code=403
message="Not authenticated2"

[and.response.forbidden]
